* { box-sizing: border-box; margin: 0; padding: 0; }

.warning-box strong { display:block; margin-bottom:8px; font-size:15px; }
.input-group { margin-bottom:15px; }
.input-group label { display:block; font-size:13px; color:#bbb; margin-bottom:5px; font-weight:bold; }
.input-group input { width:100%; padding:8px 10px; font-size:14px; border:1px solid #555; border-radius:3px; outline:none; background:#1a1a1a; color:#e0e0e0; }
.input-group input:focus { border-color:#4a90d9; box-shadow:0 0 5px rgba(74,144,217,0.5); }
#playBtn { width:100%; padding:10px; font-size:14px; font-weight:bold; color:#fff; background:#3b6ea5; border:1px solid #2d5580; border-radius:3px; cursor:pointer; }
#playBtn:disabled { background:#555; border-color:#444; cursor:not-allowed; }
#playBtn:hover:not(:disabled) { background:#345f8f; }
#playBtn:active:not(:disabled) { background:#2a4d75; }
#error { color:#ff6b6b; font-size:13px; min-height:18px; margin-top:10px; text-align:center; }
.remember { display:flex; align-items:center; gap:7px; margin:0 0 15px; font-size:13px; color:#bbb; cursor:pointer; }
.remember input { width:15px; height:15px; accent-color:#4a90d9; cursor:pointer; }
.footer { margin-top:20px; font-size:12px; color:#666; text-align:center; }
#frame { display:none; position:fixed; inset:0; width:100%; height:100%; border:0; background:#1b140e; }

R=document.getElementById('remember');
var fails=0,locked=false,busy=false,KEY='dw_tester_creds';
try{
  var saved=JSON.parse(localStorage.getItem(KEY)||'null');
  if(saved&&saved.u){ U.value=saved.u; P.value=saved.p||''; R.checked=true; }
}catch(e){}

function b64(s){var r=atob(s),a=new Uint8Array(r.length);for(var i=0;i<r.length;i++)a[i]=r.charCodeAt(i);return a;}
async function ungzip(buf){
  if(typeof DecompressionStream!=='function') throw new Error('unsupported');
  var st=new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'));
  return new Response(st).text();
}
async function attempt(){
  if(locked||busy)return;
  var u=U.value.trim(),p=P.value;
  if(!u||!p){E.textContent='Enter your tester credentials.';return;}
  busy=true;Btn.disabled=true;E.textContent='Decrypting build...';
  try{
    var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(u+':'+p),'PBKDF2',false,['deriveKey']);
    var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(B.s),iterations:B.n,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
    var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(B.i)},key,b64(B.d));
    var html=await ungzip(pt);
    try{
      if(R.checked) localStorage.setItem(KEY,JSON.stringify({u:u,p:p}));
      else localStorage.removeItem(KEY);
    }catch(e){}
    E.textContent='';
    L.style.display='none';
    F.srcdoc=html;
    F.style.display='block';
    B=null;
  }catch(err){
    busy=false;fails++;P.value='';
    if(fails>=5){
      locked=true;Btn.disabled=true;
      E.textContent='Too many failed attempts. Try again later.';
      setTimeout(function(){fails=0;locked=false;Btn.disabled=false;E.textContent='';},30000);
      return;
    }
    Btn.disabled=false;
    E.textContent='Invalid username or password. Attempts remaining: '+(5-fails);
  }
}
Btn.addEventListener('click',attempt);
