<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Street King</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Staatliches&family=Oswald:wght@600;700&display=swap" rel="stylesheet">
<style>
:root {
  --sky-a:#3aa6d8; --sky-b:#7fd0e8;
  --panel:#241d33; --panel-2:#332747;
  --panel-brd:rgba(255,255,255,0.14);
  --ink:#ffffff; --ink-dim:#b9aecd;
  --gold:#ffc42e; --gold-d:#e09a12;
  --green:#4ad46a; --green-d:#28a54a;
  --red:#ff5c6e; --blue:#4fc3f7;
  --shadow:0 4px 0 rgba(0,0,0,0.28);
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { height:100%; overflow:hidden; }
body {
  font-family:'Baloo 2','Nunito',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:#1b140e; color:var(--ink);
  height:100dvh; position:relative; overflow:hidden;
  max-width:520px; margin:0 auto;
  user-select:none;
}
.num { font-variant-numeric:tabular-nums; font-weight:800; }

/* ============ WORLD (fills the entire screen) ============ */
#world {
  position:absolute; inset:0;
  background:linear-gradient(#2b6fb8 0%, var(--sky-a) 38%, var(--sky-b) 100%);
  overflow:hidden; 
}

#camera { position:absolute; left:0; top:0; transform-origin:0 0; will-change:transform; }

.cell { position:absolute; width:132px; }
.cell img { display:block; width:132px; height:auto; pointer-events:none; }

.lot { position:absolute; width:132px; background:none; border:none; padding:0; cursor:pointer; }
.lot img { display:block; height:auto; pointer-events:none; transition:filter .12s ease, transform .12s ease; }
/* Only actionable buildings react. A permanent drop shadow under every
   sprite reads as the whole town hovering off the ground. */
.lot.tappable:hover img { filter:drop-shadow(0 5px 3px rgba(0,0,0,0.35)); transform:translateY(-2px); }
.lot.tappable:active img { filter:drop-shadow(0 2px 2px rgba(0,0,0,0.35)); transform:translateY(1px); }
.lot.tappable:active img { transform:translateY(2px); }
.lot.decor { pointer-events:none;   /* scenery must never swallow a click meant for the building behind it */
     cursor:default; pointer-events:none; }

/* floating chip above a building — Bud Farm's hovering value tags */
.chip {
  position:absolute; left:50%; transform:translate(-50%,0);
  /* the plain chip carries the lockup's capacity; on dark panel it was
     unreadable, so it gets the same bright face as the coloured ones */
  background:linear-gradient(#f5ead2,#cbb794); color:#2a2013;
  border:2px solid #fff6e0; border-radius:999px;
  padding:3px 10px; font-size:8.5px; font-weight:800; white-space:nowrap; letter-spacing:1px; text-align:center; line-height:1.15;
  box-shadow:var(--shadow); pointer-events:none; letter-spacing:0.2px;
}
.chip b { display:block; font-size:12.5px; letter-spacing:0; }
.chip.gold  { background:linear-gradient(#ffd45e,#f0a91b); color:#4a2d00; border-color:#fff2c0; }
.chip.green { background:linear-gradient(#5ee27d,#2ba550); color:#04310f; border-color:#c7f7d2; }
.chip.red   { background:linear-gradient(#ff9aa4,#e8556a); color:#2a0004; border-color:#ffe2e6; }
@keyframes bob { 0%,100%{ transform:translate(-50%,0);} 50%{ transform:translate(-50%,-5px);} }
.chip { animation:bob 2.6s ease-in-out infinite; }

@keyframes hammer { 0%,100%{ transform:rotate(0);} 50%{ transform:rotate(-5deg);} }
.lot.upgrading img { animation:hammer .28s ease-in-out infinite; transform-origin:50% 90%; }
.lot.upgrading::after {
  content:'👷'; position:absolute; left:50%; top:-6px; transform:translateX(-50%); font-size:20px;
}

/* ============ TOP HUD — slim bar, sits over the world ============ */
#hudTop {
  position:absolute; left:0; right:0; top:0; z-index:20;
  background:rgba(20,15,10,0.9); backdrop-filter:blur(6px);
  padding:calc(env(safe-area-inset-top) + 6px) 8px 8px;
  display:flex; align-items:center; justify-content:space-between; gap:4px;
  border-bottom:1px solid #6b4f2c; box-shadow:0 2px 8px rgba(0,0,0,0.6);
}
.game-title { font-family:'Permanent Marker',cursive; font-size:.72rem; color:#e2b94b;
  text-shadow:1px 1px 0 #000, 0 0 6px #6b4f1c; letter-spacing:.3px; line-height:1.05;
  white-space:nowrap; flex-shrink:0; }
.game-title span { display:block; font-size:.4rem; color:#b0976b; letter-spacing:1px;
  font-family:'Staatliches',sans-serif; white-space:nowrap; }
.hud-left { display:flex; align-items:center; gap:6px; flex-shrink:0; }
.badges { display:flex; gap:4px; align-items:center; margin-left:auto; }
.money-badge { background:#281f14; border:1.5px solid #c9a030; border-radius:20px;
  padding:3px 7px; display:flex; align-items:center; gap:5px; height:30px;
  box-shadow:inset 0 1px 3px rgba(0,0,0,.6), 0 2px 6px black; }
.money-badge.debt { border-color:#b3563a; }
.money-badge.goal { border-color:#7a8b40; }
/* the glyph's ink sits low in its em box, so nudge it up to sit on the
   same optical line as the number beside it */
.goal-ico { color:#cfe07a; font-size:1.05rem; font-weight:700; line-height:1;
  display:block; position:relative; top:0px; text-shadow:0 0 8px #7a8b40; }
.money-icon { font-family:'Oswald',sans-serif; font-size:1.05rem; font-weight:700;
  color:#f5c542; text-shadow:0 0 8px #c9a030, 0 1px 2px black; line-height:1;
  position:relative; top:1px; }
.money-badge.debt .money-icon { color:#ff9b7a; }
.money-value { font-family:'Staatliches',sans-serif; font-size:.8rem; color:#f5e7c6;
  text-shadow:0 1px 0 #3b2b1a; letter-spacing:.5px; }

#cityTab { position:absolute; z-index:19; left:50%; transform:translateX(-50%);
  top:calc(env(safe-area-inset-top) + 46px);
  background:#3e2b1a; background-image:linear-gradient(180deg,#5a3f24,#2f1e10);
  border:2px solid #8b6b40; border-top:none; border-radius:0 0 14px 14px;
  padding:3px 14px; cursor:pointer; box-shadow:0 4px 10px rgba(0,0,0,.5);
  font-family:'Staatliches',sans-serif; font-size:.85rem; color:#f5e7c6; letter-spacing:1px; }
#cityTab:active { transform:translateX(-50%) translateY(2px); }

/* ============ BOTTOM TOOLBAR — collapsible build tray ============ */
#toolbarContainer { position:absolute; left:0; right:0; bottom:0; z-index:20; }
.toolbar-tab { width:72px; height:20px; margin:0 auto;
  background:#3e2b1a; background-image:linear-gradient(180deg,#5a3f24,#2f1e10);
  border:2px solid #8b6b40; border-bottom:none; border-radius:12px 12px 0 0;
  display:flex; align-items:center; justify-content:center; cursor:pointer;
  box-shadow:0 -4px 10px rgba(0,0,0,.5); position:relative; z-index:16; }
.toolbar-tab .chevron { font-size:.8rem; color:#e2b94b; line-height:1;
  text-shadow:0 1px 2px black; display:inline-block; transition:transform .3s ease; }
#toolbarContainer.collapsed .toolbar-tab .chevron { transform:rotate(180deg); }
.toolbar-wrapper { overflow:hidden; transition:max-height .3s ease, opacity .3s ease;
  max-height:300px; opacity:1; }
#toolbarContainer.collapsed .toolbar-wrapper { max-height:0; opacity:0; }
.toolbar { background:#2f2318; background-image:linear-gradient(0deg,#1f150c,#463829);
  padding:10px 10px 12px; display:flex; gap:10px; overflow-x:auto; align-items:stretch;
  border-top:3px solid #5e4328; box-shadow:0 -8px 18px rgba(0,0,0,.8);
  scrollbar-width:thin; scrollbar-color:#7a5e3c #2b1f12; }
.toolbar::-webkit-scrollbar { height:5px; }
.toolbar::-webkit-scrollbar-thumb { background:#7a5e3c; border-radius:20px; }

.item-card { flex:0 0 auto; min-width:96px; border-radius:18px 18px 14px 14px;
  background:#c8a87c; background-image:linear-gradient(160deg,#d4b68c,#b59060);
  border:2px solid #8b6b40; box-shadow:0 6px 0 #5a3d20, 0 12px 18px rgba(0,0,0,.6);
  display:flex; flex-direction:column; align-items:center; cursor:pointer;
  transition:all .07s ease; overflow:hidden; position:relative; }
.item-card:active { transform:translateY(4px); box-shadow:0 2px 0 #5a3d20,0 8px 12px rgba(0,0,0,.7); }
.item-card.selected { border-color:#f0d060;
  box-shadow:0 6px 0 #5a3d20, 0 0 0 3px #f0d060, 0 12px 18px rgba(0,0,0,.6); }
.item-card.unaffordable { filter:grayscale(.65); opacity:.7; }
.card-ribbon { width:100%; height:10px; flex-shrink:0; border-radius:16px 16px 0 0;
  background:#6b4c28; background-image:linear-gradient(180deg,#8b683c,#4a3118);
  border-bottom:1px solid #c9a55c; }
.item-card.special .card-ribbon { background-image:linear-gradient(180deg,#c9a55c,#7a5a22); }
.card-art { width:52px; height:42px; margin:7px 0 2px;
  display:flex; align-items:flex-end; justify-content:center; }
.card-art img { max-width:100%; max-height:100%; display:block; }
.card-name { font-family:'Staatliches',sans-serif; font-size:.68rem; color:#2d1f0e;
  background:rgba(255,245,220,.7); padding:2px 9px; border-radius:16px; margin:2px 0 5px;
  text-transform:uppercase; letter-spacing:1px; border:1px solid #8b6b40; white-space:nowrap; }
.buy-btn { background:#2e401a; background-image:linear-gradient(180deg,#45612a,#1e2b0e);
  border:1px solid #b5953c; border-radius:20px; padding:4px 12px; margin-bottom:9px;
  font-family:'Staatliches',sans-serif; font-size:.78rem; color:#e7dfb1;
  text-shadow:0 1px 2px black; box-shadow:0 3px 0 #1a230b,0 2px 6px black;
  letter-spacing:1px; min-width:52px; text-align:center; pointer-events:none; }
.item-card.selected .buy-btn { background-image:linear-gradient(180deg,#e2b94b,#a07b20);
  color:#1a1a1a; text-shadow:none; border-color:#f0d060; }




#setBtn { width:30px; height:30px; flex-shrink:0; margin-right:4px; cursor:pointer;
  border-radius:9px; border:1.5px solid #c9a030;
  background:#281f14; background-image:linear-gradient(180deg,#3e2f1c,#1d160d);
  color:#f5c542; font-size:.95rem; line-height:1;
  box-shadow:inset 0 1px 3px rgba(0,0,0,.6), 0 2px 6px black; }
#setBtn:active { transform:translateY(2px); }

#cta { display:block; width:calc(100% - 20px);
  margin:0 10px calc(env(safe-area-inset-bottom) + 10px);
  padding:11px; border:2px solid #b5953c; border-radius:16px; cursor:pointer;
  background:#c9a030; background-image:linear-gradient(180deg,#e2b94b,#a07b20);
  color:#241a06; font-family:'Staatliches',sans-serif; font-size:1rem; letter-spacing:1.5px;
  box-shadow:0 4px 0 #6b4a1c, 0 6px 12px rgba(0,0,0,.6); }
#cta:active { transform:translateY(3px); box-shadow:0 1px 0 #6b4a1c; }
#cta:disabled { filter:grayscale(.7); opacity:.6; }

/* delivery bar + collect bubble floating over a lockup */
/* The in-progress pill is on screen far longer than the collect one, so
   it wears the same BUY-pill face: green body, brass edge, gold text.
   The fill is a lighter wash of the same green rather than a lime bar. */
.dbar { position:absolute; left:50%; top:-54px; transform:translateX(-50%);
  min-width:86px; height:24px; border-radius:20px; overflow:hidden;
  background:#2e401a; background-image:linear-gradient(180deg,#45612a,#1e2b0e);
  border:1px solid #b5953c; box-shadow:0 3px 0 #1a230b, 0 2px 6px black; }
.dbar-fill { position:absolute; left:0; top:0; bottom:0;
  background:linear-gradient(180deg,#6d8f3e,#3b5418); opacity:.95; }
.dbar-txt { position:absolute; inset:0; display:grid; place-items:center;
  font-family:'Staatliches',sans-serif; font-size:.72rem; letter-spacing:1px;
  color:#f5c542; text-shadow:0 1px 2px #000; }
/* the collect bubble wears the toolbar's BUY pill: same green face and
   brass edge, with the cash figure in gold so it reads as money */
.dbubble { position:absolute; left:50%; top:-58px; transform:translateX(-50%);
  padding:5px 13px; border-radius:20px; cursor:pointer; white-space:nowrap;
  background:#2e401a; background-image:linear-gradient(180deg,#45612a,#1e2b0e);
  border:1px solid #b5953c; color:#f5c542;
  font-family:'Staatliches',sans-serif; font-size:.82rem; letter-spacing:1px;
  text-shadow:0 1px 2px #000;
  box-shadow:0 3px 0 #1a230b, 0 2px 6px black;
  animation:bob 1.6s ease-in-out infinite; }
.dbubble:active { transform:translateX(-50%) translateY(2px);
  box-shadow:0 1px 0 #1a230b, 0 2px 4px black; }

/* deliveries running in other zones */
/* pinned inside the play area, not hanging off the left edge */
#deliveryPills { position:absolute; z-index:19; left:8px; right:8px;
  top:calc(env(safe-area-inset-top) + 78px);
  display:flex; flex-direction:column; align-items:flex-start; gap:5px;
  pointer-events:none; }
#deliveryPills > * { pointer-events:auto; max-width:100%; }
/* Every delivery pill - over the lockup or listed for another town,
   running or ready - is the SAME green pill with gold text. One look,
   one meaning: this is stock coming in and money to collect. */
.dpill { position:relative; overflow:hidden; min-width:132px; padding:5px 12px;
  border-radius:20px; background:#2e401a;
  background-image:linear-gradient(180deg,#45612a,#1e2b0e);
  border:1px solid #b5953c; box-shadow:0 3px 0 #1a230b, 0 2px 6px black; }
.dpill-fill { position:absolute; left:0; top:0; bottom:0;
  background:linear-gradient(180deg,#6d8f3e,#3b5418); opacity:.95; }
.dpill-txt { position:relative; font-family:'Staatliches',sans-serif; font-size:.72rem;
  color:#f5c542; letter-spacing:1px; text-shadow:0 1px 2px #000; }
/* NOT the shared bob keyframe: that one carries translate(-50%) for
   centred chips and would drag this pill off the left edge. */
@keyframes bobY { 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-4px);} }
.dpill.ready { cursor:pointer; color:#f5c542; font-family:'Staatliches',sans-serif;
  font-size:.72rem; letter-spacing:1px; text-shadow:0 1px 2px #000;
  animation:bobY 1.6s ease-in-out infinite; }
.dpill.ready:active { animation:none; transform:translateY(2px); box-shadow:0 1px 0 #1a230b; }

.lslider { width:100%; margin:6px 0 2px; accent-color:#e2b94b; height:26px; touch-action:none; }
.lval { text-align:center; font-family:'Staatliches',sans-serif; font-size:1.15rem;
  color:#f5e7c6; letter-spacing:1px; margin-bottom:2px; }

#tutorial { position:absolute; inset:0; z-index:60; pointer-events:none; }
.tut-ring.flat { box-shadow:0 0 14px #ffd45e; animation:none; }
.tut-ring { position:absolute; border:3px solid #ffd45e; border-radius:14px;
  box-shadow:0 0 0 4000px rgba(10,6,2,0.55), 0 0 18px #ffd45e;
  animation:tutPulse 1.2s ease-in-out infinite; }
@keyframes tutPulse { 0%,100%{ box-shadow:0 0 0 4000px rgba(10,6,2,0.55), 0 0 12px #ffd45e; }
                      50%{ box-shadow:0 0 0 4000px rgba(10,6,2,0.55), 0 0 26px #ffd45e; } }
.tut-chev { position:absolute; transform:translateX(-50%); color:#ffd45e; font-size:26px;
  text-shadow:0 2px 4px #000; animation:tutBob 0.9s ease-in-out infinite; }
@keyframes tutBob { 0%,100%{ margin-top:0; } 50%{ margin-top:-8px; } }
.tut-box { position:absolute; transform:translate(-50%,-100%); width:270px; max-width:calc(100vw - 16px);
  background:#2f2318; background-image:linear-gradient(180deg,#5a4326,#2b2013);
  border:2px solid #c9a55c; border-radius:14px; padding:10px 12px 12px;
  font-family:'Staatliches',sans-serif; font-size:14px; letter-spacing:.4px;
  color:#f5e7c6; text-align:center; line-height:1.35;
  box-shadow:0 8px 18px rgba(0,0,0,.7); pointer-events:auto; }
.tut-box.below { transform:translate(-50%,0); }
.tut-skip { display:block; margin:8px auto 0; background:none; border:none;
  color:#b0976b; font-family:'Staatliches',sans-serif; font-size:11px;
  letter-spacing:1px; cursor:pointer; text-decoration:underline; }

.card-sub2 { font-family:'Staatliches',sans-serif; font-size:.55rem; color:#3a2a12;
  margin-bottom:7px; letter-spacing:.5px; }

/* empty plot marker — where a bought building can go */
.lot.empty .plot { display:block; width:100%; height:auto; overflow:visible; }
.lot.empty .plot polygon { fill:rgba(60,40,20,.28); stroke:rgba(245,231,198,.75);
  stroke-width:3; stroke-dasharray:9 7; }
.lot.empty.ready .plot polygon { fill:rgba(226,185,75,.32); stroke:#f0d060;
  animation:plotPulse 1s ease-in-out infinite; }
@keyframes plotPulse { 0%,100%{opacity:.7;} 50%{opacity:1;} }

/* ============ SHEETS ============ */
.overlay { position:fixed; inset:0; background:rgba(18,12,6,0.62); z-index:100;
           display:flex; align-items:flex-end; justify-content:center; }
/* sheets wear the same leather-and-brass as the toolbar */
.sheet {
  background:#2f2318; background-image:linear-gradient(180deg,#463829,#241a10);
  width:100%; max-width:520px; max-height:80dvh;
  border-radius:22px 22px 0 0; padding:8px 14px calc(env(safe-area-inset-bottom) + 14px);
  overflow-y:auto; animation:slideUp .22s ease-out; border-top:3px solid #8b6b40;
}
@keyframes slideUp { from { transform:translateY(100%);} to { transform:translateY(0);} }
.sheet-grab { width:40px; height:4px; border-radius:99px; background:#8b6b40;
              margin:4px auto 12px; }
.sheet h2 { font-family:'Permanent Marker',cursive; font-size:19px; text-align:center;
  margin-bottom:4px; letter-spacing:1px; color:#e2b94b; text-shadow:1px 1px 0 #000; }
.sheet .sub { font-family:'Staatliches',sans-serif; font-size:13px; text-align:center;
  color:#c9b48c; margin-bottom:14px; letter-spacing:.5px; }

.btn { display:block; width:100%; padding:12px; border-radius:14px; font-size:14px;
       font-weight:800; border:none; cursor:pointer; font-family:inherit; letter-spacing:0.5px;
       box-shadow:0 4px 0 rgba(0,0,0,0.3); }
.btn:active { transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,0.3); }
.btn:disabled { filter:grayscale(0.8); opacity:0.45; }
.btn-g { background:linear-gradient(#5ee27d,#2ba550); color:#04310f; box-shadow:0 4px 0 #1c7a37; }
.btn-r { background:linear-gradient(#ff7b89,#e03a4d); color:#3d0008; box-shadow:0 4px 0 #a82233; }
.btn-b { background:linear-gradient(#7fd6ff,#2b8fd0); color:#022637; box-shadow:0 4px 0 #1c6a9c; }
.btn-o { background:linear-gradient(#ffd45e,#f0a91b); color:#4a2d00; box-shadow:0 4px 0 var(--gold-d); }
.btn-h { background:rgba(255,255,255,0.09); color:var(--ink); box-shadow:0 4px 0 rgba(0,0,0,0.25); }
.btns { display:flex; gap:8px; margin-top:12px; }
.btns .btn { flex:1; }
.btn-sm { padding:8px 12px; font-size:12px; }

.row {
  display:flex; align-items:center; gap:10px; padding:10px;
  background:rgba(0,0,0,0.22); border-radius:14px; margin-bottom:8px;
}
.row-main { flex:1; min-width:0; }
.row-name { font-family:'Staatliches',sans-serif; font-size:15px; letter-spacing:.5px; color:#f5e7c6; }
.row-meta { font-size:11px; color:#b0976b; font-weight:700; margin-top:1px; }
.row-price { font-family:'Staatliches',sans-serif; font-size:15px; text-align:right; color:#f5e7c6; }
.up { color:var(--red); } .dn { color:var(--green); }
.row-acts { display:flex; gap:5px; }

.qty { display:flex; align-items:center; justify-content:center; gap:8px; margin:10px 0; }
.qty input { width:76px; text-align:center; border:2px solid #8b6b40; border-radius:12px;
             padding:9px; font-size:16px; font-weight:800; background:rgba(0,0,0,0.3);
             color:var(--ink); font-family:inherit; }
.step { width:40px; height:40px; border-radius:12px; border:none; cursor:pointer;
        background:rgba(255,255,255,0.1); color:var(--ink); font-size:19px; font-weight:800;
        font-family:inherit; }
.step:active { transform:translateY(2px); }

.city-row { display:flex; align-items:center; gap:10px; width:100%; padding:12px 10px;
            background:rgba(0,0,0,0.22); border:none; border-radius:14px; margin-bottom:8px;
            color:var(--ink); font-family:inherit; font-size:14px; font-weight:800; cursor:pointer; }
.city-row.sel { outline:2px solid #e2b94b; }
.city-dot { width:12px; height:12px; border-radius:50%; flex-shrink:0; }
.city-row .tag { margin-left:auto; font-size:10px; color:var(--ink-dim); }

/* ============ TOASTS ============ */
/* while the tutorial owns the top of the screen, toasts move down out
   of the caption's way */
body.tut-on #toasts { top:auto !important; bottom:200px; }
/* sits BELOW the travel tab, not behind it */
#toasts { position:absolute; left:50%; transform:translateX(-50%); max-width:calc(100vw - 16px);
          top:calc(env(safe-area-inset-top) + 96px); z-index:70;
          display:flex; flex-direction:column; gap:6px; width:max-content; max-width:88%; }
/* Toasts were the last thing still wearing the old purple panel - they
   are the pills that read "moving stock in, 12s" and the payout. Same
   leather-and-brass as everything else; the money ones go green. */
.toast {
  background:#2f2318; background-image:linear-gradient(180deg,#5a4326,#2b2013);
  border:1px solid #b5953c; border-radius:20px;
  padding:7px 14px; font-family:'Staatliches',sans-serif; font-size:.78rem;
  letter-spacing:.6px; color:#f5e7c6; text-align:center; text-shadow:0 1px 2px #000;
  box-shadow:0 3px 0 #1a130a, 0 2px 8px rgba(0,0,0,.6);
  animation:toastLife 3.4s ease forwards;
}
.toast.bad  { background-image:linear-gradient(180deg,#6b2f24,#2e130e); border-color:#c96a4a; color:#ffd9cc; }
.toast.good { background-image:linear-gradient(180deg,#45612a,#1e2b0e); border-color:#b5953c; color:#f5c542; }
@keyframes toastLife {
  0%{ transform:translateY(-14px) scale(.9); opacity:0; }
  8%{ transform:none; opacity:1; }
  86%{ transform:none; opacity:1; }
  100%{ transform:translateY(-10px); opacity:0; }
}

#nightOverlay { position:absolute; inset:0; background:#0b0716; opacity:0;
                pointer-events:none; z-index:80; transition:opacity .42s ease; }
#nightOverlay.active { opacity:1; }

/* ============ LOGIN GATE ============ */
#gateLogin {
  position:fixed; inset:0; z-index:9999;
  display:flex; align-items:center; justify-content:center;
  background:#1b140e; padding:20px;
}
.gate-box {
  width:100%; max-width:380px; background:#241d33;
  border:1px solid rgba(255,255,255,0.14); border-radius:10px;
  box-shadow:0 8px 30px rgba(0,0,0,0.6); overflow:hidden;
}
.gate-header {
  background:#332747; border-bottom:1px solid rgba(255,255,255,0.14);
  padding:16px 20px; font-family:'Staatliches',sans-serif; letter-spacing:1px;
  font-size:1rem; color:#e2b94b; text-align:center;
}
.gate-body { padding:22px 20px; }
.gate-warning {
  background:#3a2f00; border:1px solid #665500; color:#ffcc00;
  padding:14px; margin-bottom:18px; font-size:12.5px; line-height:1.6; border-radius:6px;
}
.gate-warning strong { display:block; margin-bottom:6px; font-size:14px; }
.gate-field { margin-bottom:14px; }
.gate-field label {
  display:block; font-size:12.5px; color:#b9aecd; margin-bottom:5px; font-weight:700;
}
.gate-field input {
  width:100%; padding:9px 10px; font-size:14px; border-radius:6px; outline:none;
  border:1px solid rgba(255,255,255,0.18); background:#1b140e; color:#fff;
}
.gate-field input:focus { border-color:#4fc3f7; box-shadow:0 0 6px rgba(79,195,247,0.5); }
#gatePlayBtn {
  width:100%; padding:11px; font-size:14px; font-weight:700; color:#1a1a1a;
  background:linear-gradient(180deg,#ffd45e,#f0a91b); border:1px solid #e09a12;
  border-radius:6px; cursor:pointer; letter-spacing:.5px;
}
#gatePlayBtn:active { transform:translateY(1px); }
#gateError { color:#ff5c6e; font-size:12.5px; min-height:18px; margin-top:10px; text-align:center; }
</style>
</head>
